<form nz-form [formGroup]="form" (ngSubmit)="submit()">
  <div nz-row [nzGutter]="8" class="pb-10">
    <div nz-col [nzSpan]="12">
      <nz-form-item>
        <nz-form-label [nzSpan]="10" nzFor="date" nzRequired>預約日期</nz-form-label>
        <nz-form-control [nzSpan]="20" nzErrorTip="請選擇預約日期">
          <nz-date-picker formControlName="date" style="width: 100%"></nz-date-picker>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col [nzSpan]="12">
      <nz-form-item>
        <nz-form-label [nzSpan]="10" nzFor="time" nzRequired>預約時間</nz-form-label>
        <nz-form-control [nzSpan]="14" nzErrorTip="請選擇預約時間">
          <nz-time-picker formControlName="time" style="width: 100%" nzFormat="HH:mm"></nz-time-picker>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
  <div nz-row class="pb-10">
    <div nz-col [nzSpan]="24">
      <nz-form-item>
        <nz-form-label [nzSpan]="5" nzFor="name" nzRequired>預約人姓名</nz-form-label>
        <nz-form-control [nzSpan]="19" nzErrorTip="請輸入預約人姓名">
          <input nz-input formControlName="name" placeholder="請輸入預約者" />
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
  <div nz-row class="pb-10">
    <div nz-col [nzSpan]="24">
      <nz-form-item>
        <nz-form-label [nzSpan]="5" nzFor="remark">備註</nz-form-label>
        <nz-form-control [nzSpan]="19">
          <input nz-input formControlName="remark" placeholder="請輸入備註" />
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
  <nz-divider></nz-divider>
  <div class="buttonDiv">
    <button nz-button nzType="primary" type="submit">確認</button>
    <button nz-button nzType="default" type="button" (click)="close()">取消</button>
  </div>
</form>
